# Smallest App Runner footprint — stretch $150 AWS credits
version: 1.0
runtime: nodejs22
build:
  commands:
    build:
      - npm install --omit=dev
run:
  network:
    port: 8790
  command: npx tsx server/index.ts
  env:
    - name: HOST
      value: "0.0.0.0"
    - name: PORT
      value: "8790"
    - name: DOC_AI_DB
      value: /tmp/doc-ai.sqlite
    - name: ALLOWED_ORIGINS
      value: https://whatsupdoc.fyi,https://www.whatsupdoc.fyi,https://api.whatsupdoc.fyi
# Instance (set in console / CLI): 0.25 vCPU, 0.5 GB RAM, 1 instance, no auto-scale-out
# LLM is Alexa+ — do not enable Bedrock / Grok on this service
